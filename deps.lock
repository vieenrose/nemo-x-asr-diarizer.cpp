# Pinned state of the two dependency worktrees this project builds against.
#
# WHY THIS FILE EXISTS: the composite links CrispASR (static, with its own vendored ggml) and audio.cpp
# (shared, with a second hidden ggml). Both live in SEPARATE repositories outside this one, so nothing here
# tracked them - and every optimisation of this session lives in those repos, not in this one. A clean
# checkout would therefore rebuild the 0.47 baseline while the ledger claimed 0.269. scripts/check_deps.sh
# compares the worktrees against this file and the build scripts refuse to continue on drift, because a
# silently stale dependency is indistinguishable from a failed optimisation.
#
# What the pinned commits contain (all measured on the phone, armed):
#   crispasr 6b93fc1  graph-reuse + latent-use-after-free fix; f16 transducer joint (3.5x on that phase);
#                     host phase timers; GGUF tensor-name prefix support for the merged bundle
#   crispasr/ggml     work-size threshold for small copy/elementwise ops; removal of a per-element 64-bit
#                     division in the strided binary-op index (both bit-identical, both measured 0% here)
#   audiocpp   428d924  mel filterbank skips its 98.5% zero weights and drops software quad precision
#                     (frontend 18x, the session's largest win); no padding of streaming encoder windows;
#                     tensor-name list may prefix the file's tensor list (bundle support); phase timers
#   audiocpp   58e8496  fixes the layer0-dump oracle: attention_mask was never pinned as a graph output
#                     (unlike rope_cos/rope_sin, which were), so gallocr could recycle its buffer before the
#                     post-hoc AUDIOCPP_DUMP_LAYER0 read - the dumped mask was garbage (NaN/Inf/+-65000, not
#                     0/-10000), which alone explains the layer0_port harness's "100% non-finite" attention
#                     output that looked like a Q/K/V axis bug. Gated on AUDIOCPP_DUMP_LAYER0 after an
#                     unconditional first attempt measurably moved production confidence scores in the
#                     5th/6th decimal (turn boundaries/speaker labels unchanged) - verified byte-identical to
#                     the pre-fix parent commit when the env var is unset.
#   audiocpp   3d3d2e1  adds run_layer0_isolated(): rebuilds encoder layer 0 alone, in its own graph, as a
#                     sound oracle for the port (the running 32-layer graph's ggml_set_output stages are not
#                     sound - a later layer's tensor can land on the same gallocr slot). Verified byte-
#                     identical final output to production, 7/12 stages now match the production trace
#                     exactly (up from 0). Opt-in via AUDIOCPP_LAYER0_ISOLATED; production path untouched.
#   audiocpp   0babdf9  AUDIOCPP_DUMP_LAYER_INDEX: dump/isolate any layer (default 0, same as before). Used to
#                     confirm the byte-exact port result generalises - layers 0, 15, and 30 (first, middle,
#                     last of 31) all port byte-identical with their own real weights.
#   audiocpp   be2af81  run_encoder_isolated(): sound oracle for the WHOLE encoder stack (all layers chained
#                     in one graph), not just one layer. encoder_out captures production's own real
#                     31-layer output; AUDIOCPP_ENCODER_ISOLATED writes the isolated rebuild's
#                     iso_encoder_out.f32 for comparison. Verified byte-identical to production on two clips.
#   audiocpp   a9c032a  run_head_isolated(): sound oracle for the head (final_norm..sigmoid). probabilities is
#                     a true graph output (nothing computed after it) so it was already sound; this gives a
#                     standalone rebuild to diff a CrispASR port against. Byte-identical (max abs diff 0.0)
#                     to production. AUDIOCPP_HEAD_ISOLATED triggers it; probabilities.f32 (production's own)
#                     is now dumped unconditionally alongside the AUDIOCPP_DUMP_LAYER0 files.
#   audiocpp   4d3de79  Session::set_external_encoder() + audiocpp_nemotron3_diar_set_external_encoder C API:
#                     lets a caller redirect JUST encode() (encoder+head) to a different ggml runtime while
#                     every other piece of the family (mel frontend, streaming state, turn decoding) keeps
#                     running audio.cpp's own code unmodified. ggml symbol visibility unaffected (leak check
#                     still 0). This is the actual merge point nemo-x-asr-diarizer.cpp wires up.
crispasr=714f457
crispasr_ggml=512a020
audiocpp=4d3de79
